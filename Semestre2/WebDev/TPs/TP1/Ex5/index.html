<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ex5</title>
    <style>
      .element {
        max-width: fit-content;
        margin-inline: auto;
      }

      table {
        border-collapse: collapse;
        text-align: center;
      }
      td,
      th {
        border: 1px solid black;
        padding: 5px;
      }
    </style>
  </head>
  <body>
    <div class="element">
      <table>
        <tr>
          <th colspan="5">Comparatif modele economique</th>
        </tr>
        <tr>
          <th colspan="3">Modele</th>
          <th rowspan="2">Vitesse en kg/heure</th>
          <th rowspan="2">Consommation en litre/100 km</th>
        </tr>
        <tr>
          <th>Marque</th>
          <th>Type</th>
          <th>Numero de serie</th>
        </tr>
        <tr>
          <td>Peugeot</td>
          <td>206</td>
          <td>B2</td>
          <td>234.34</td>
          <td>132 5,7</td>
        </tr>
        <tr>
          <td>Citroen</td>
          <td>AX</td>
          <td>AT67B8</td>
          <td>6789</td>
          <td>126 5,5</td>
        </tr>
      </table>
    </div>
  </body>
</html>
