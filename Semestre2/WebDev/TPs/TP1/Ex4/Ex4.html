<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ex4</title>
    <style>
      .element {
        max-width: fit-content;
        margin-inline: auto;
      }

      table {
        border-collapse: collapse;
        text-align: center;
      }
      td {
        border: 1px solid black;
        padding: 5px;
      }
    </style>
  </head>
  <body>
    <div class="element">
      <table>
        <tr>
          <td rowspan="2">Annees</td>
          <td colspan="3">Salaires</td>
        </tr>
        <tr>
          <td>Sud</td>
          <td>Nord</td>
          <td>Total</td>
        </tr>
        <tr>
          <td>2005</td>
          <td>20M</td>
          <td>18M</td>
          <td>38M</td>
        </tr>
        <tr>
          <td>2006</td>
          <td>24M</td>
          <td>21M</td>
          <td>35M</td>
        </tr>
      </table>
    </div>
  </body>
</html>
